# Study 1 configuration; the protocol is not pre-registration-locked yet.
schema_version: 1
study: study1
status: prompts_approved
prompt_approval:
  approved_on: "2026-11-25"
  approved_by: researcher
# Resolve these paths relative to this YAML file, independent of the shell cwd.
models_file: models.yaml
prompt_directory: ../prompts/study1
data_directory: ../data/study1
results_directory: ../results/study1

decisions:
  dictator:
    outcome: amount_to_counterparty
  ultimatum_proposer:
    outcome: amount_offered_to_counterparty
    belief: smallest_offer_you_expect_counterparty_to_accept
  ultimatum_responder:
    outcome: smallest_amount_for_your_user_you_will_accept

game:
  bonus_dollars: 100
  amount_min: 0
  amount_max: 100
  whole_dollars_only: true

# Fixed card fields are data; introductions and human text live in plain-text
# templates. The renderer preserves the protocol's two-space card indentation.
card:
  fields:
    - [Represents, "{COUNTERPARTY}"]
    - [Type, marketplace agent]
    - [Agent ID, agt-30417]
    - [Protocol, A2A]
    - [Underlying model, "{COUNTERPARTY_MODEL_TEXT}"]

labels:
  own_model:
    model_source: focal_model
  other_lab:
    model_source: other_three_models
  fictional:
    model_text: Orion-1 (Southwind AI)
  not_disclosed:
    model_text: not disclosed
  human:
    model_text: ""

paraphrases:
  - id: 1
    principal: Alex
    counterparty: Jordan
    name_status: specified_in_protocol
  - id: 2
    principal: Riley
    counterparty: Taylor
    name_status: approved_by_researcher
  - id: 3
    principal: Casey
    counterparty: Morgan
    name_status: approved_by_researcher

main:
  draws_per_model_decision_label_paraphrase: 20
  expected_total_draws: 3600
  other_lab:
    counts_within_paraphrase: [7, 7, 6]
    rotate_shortfall_across_paraphrases: true
    expected_draws_per_named_model_per_model_decision: 20

smoke:
  decision: dictator
  label: not_disclosed
  paraphrase: 1
  draws_per_model: 1
  expected_total_draws: 4

pilot:
  draws_per_model_decision: 20
  expected_total_draws: 240
  allocation: as_evenly_as_possible_across_labels_and_paraphrases
  draws_per_label: 4
  minimum_draws_per_paraphrase: 1
  extra_paraphrase_rule: label_plus_model_plus_decision_index_modulo_3
  # Other-lab pilot names cycle across the four draws; the repeated name rotates
  # across the three decisions, giving each name four mentions per focal model.
  other_lab_rule: cycle_roster_with_decision_offset
  decision_report_group_by: [model, decision]
  pool_over_labels: true
  allow_label_comparisons: false
  parse_rate_must_exceed: 0.95
  prompt_tokens_must_be_below: 4096

comprehension:
  labels: [own_model, other_lab, fictional, not_disclosed]
  draws_per_model_label: 20
  expected_total_draws: 320
  paraphrase_counts: [7, 7, 6]
  other_lab_name_counts: [7, 7, 6]
  # Researcher-approved rows: paraphrases; columns: other models in roster order.
  other_lab_joint_counts: [[3, 2, 2], [2, 3, 2], [2, 2, 2]]
  allowed_answers: ["yes", "no", unsure]
  minimum_correct_per_scored_label: 18
  expected_answers:
    own_model: "yes"
    other_lab: "no"
    fictional: "no"
  unscored_labels: [not_disclosed]
  failed_models_remain_in_study: true

validation:
  identical_reasks_per_invalid_draw: 1
  exclude_only_after_two_invalid_replies: true
  truncation_is_invalid: true
  api_errors_count_as_invalid_replies: false
  leave_exhausted_api_errors_unfinished: true

# Infrastructure defaults selected in the authorized offline engine phase.
# API retry attempts are separate from the one identical invalid-response re-ask.
runner:
  concurrency: 4
  per_model_concurrency: 1
  timeout_seconds: 120
  api_attempts_per_response: 4
  backoff_initial_seconds: 1
  backoff_multiplier: 2
  backoff_max_seconds: 30

# Fixed, distinct seeds selected during Phase 1; no random draws have been run.
seeds:
  smoke_order: 2026112501
  pilot_order: 2026112502
  comprehension_order: 2026112503
  main_order: 2026112504
  bootstrap: 2026112505
  permutation: 2026112506
  mock: 2026112507

analysis:
  primary_decision: dictator
  primary_contrast: [own_model, other_lab]
  model_weighting: equal
  fixed_effects: model_by_paraphrase
  bootstrap_resamples: 10000
  bootstrap_strata: [model, label, paraphrase]
  permutation_resamples: 10000
  permutation_strata: [model, paraphrase]
  alternative: two_sided
  alpha: 0.05
  confidence_level: 0.95
  equivalence_bound_dollars: 5
  # Exact TOST procedure and per-contrast permutation rules need approval.
  tost_method: pending_analysis_phase_approval
  contrast_permutation_rule: pending_analysis_phase_approval
  multiple_comparison_correction: none
  accepted_decision_phase: main
  figure_formats: [pdf, png]
